<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gulf Youth Sport | New website coming soon</title>
<meta name="description" content="Gulf Youth Sport covers school and youth sport across the Gulf. Our new website is on its way. Follow us on Instagram and YouTube in the meantime.">
<meta property="og:title" content="Gulf Youth Sport">
<meta property="og:description" content="Our new website is on its way. Follow us on Instagram and YouTube in the meantime.">
<meta property="og:image" content="https://gulfyouthsport.com/gys-logo.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;600;700&display=swap">
<style>
  :root {
    --ink: #1C2752;
    --muted: #4A5476;
    --blue: #445EA8;
    --red: #E7302A;
    --yellow: #F1D824;
    --green: #008C58;
    --maroon: #8E193E;
    --orange: #F28E20;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    background: #FFFFFF;
    color: var(--ink);
    font-family: "Barlow", "Helvetica Neue", Helvetica, Arial, sans-serif;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .stripe {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    height: 8px;
    flex: none;
    margin-top: env(safe-area-inset-top, 0px);
  }
  .stripe span:nth-child(1) { background: var(--blue); }
  .stripe span:nth-child(2) { background: var(--green); }
  .stripe span:nth-child(3) { background: var(--yellow); }
  .stripe span:nth-child(4) { background: var(--orange); }
  .stripe span:nth-child(5) { background: var(--red); }
  .stripe span:nth-child(6) { background: var(--maroon); }
  main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 24px;
    gap: 28px;
  }
  .logo { width: min(200px, 48vw); height: auto; display: block; }
  h1 {
    margin: 0;
    max-width: 760px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-style: italic;
    font-weight: 800;
    font-size: clamp(40px, 7vw, 72px);
    line-height: 0.95;
    text-transform: uppercase;
  }
  p.lede {
    margin: 0;
    max-width: 540px;
    font-size: clamp(17px, 2.2vw, 20px);
    line-height: 1.6;
    color: var(--muted);
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 4px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
    padding: 0 26px;
    border-radius: 26px;
    font-weight: 700;
    font-size: 17px;
    text-decoration: none;
    color: #FFFFFF;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(28, 39, 82, 0.18); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.insta { background: var(--blue); }
  .btn.yt { background: var(--red); }
  .btn.photos { background: var(--green); }
  .email { font-size: 17px; color: var(--muted); }
  .email a { color: var(--ink); font-weight: 600; }
  footer {
    flex: none;
    background: var(--ink);
    color: #FFFFFF;
    text-align: center;
    padding: 22px 24px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-style: italic;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.01em;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
    .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="stripe" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <main>
    <img class="logo" src="gys-logo.png" alt="Gulf Youth Sport" width="200" height="200">
    <h1>Our new website is on its way</h1>
    <p class="lede">While we build it, catch the latest stories on Instagram, watch our videos on YouTube and find your event photos in our gallery.</p>

    <nav class="links" aria-label="Gulf Youth Sport channels">
      <a class="btn insta" href="https://www.instagram.com/gulfyouthsport/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6"/></svg>
        Instagram
      </a>
      <a class="btn yt" href="https://www.youtube.com/c/GulfYouthSport" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></svg>
        YouTube
      </a>
      <a class="btn photos" href="https://gys001.zenfolio.com/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Event photos
      </a>
    </nav>

    <p class="email">Get in touch: <a href="mailto:info@gulfyouthsport.com">info@gulfyouthsport.com</a></p>
  </main>

  <footer>Electrifying Youth Sport</footer>
</body>
</html>
